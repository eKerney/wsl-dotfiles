  - trigger: ':aicode'
    replace: I am most happy with using Claude Code to debug a large client project
      and troubleshoot some problems.  We were given a very short timeframe to
      assess and fix the issues with an app for a very well known NGO.  The App
      had been built by a contract team from overseas.  Using Claude in the CLI
      I was able quickly discover the architecture of the codebase,
      duplications, and trace the logic flows through large functions and
      components.  Beyond what the standard debugger was capable of.  This
      allowed me to isolate the issue to a single line and commit the fix.  A
      process that could have taken a few days was reduced to only a couple of
      hours!

  - trigger: ':aibuilt'
    replace: At Blue Raster I took ownership of AI Powered Applications and
      Innovation.  The first challenge was determining which technology stack to
      utilize.  For what we were primarily building (React, Typescript, NextJS)
      Apps, utilizing the vercel AI SDK seemed a great option.  Smooth
      integration into NextJS, and it's built-in backend API capability allowed
      the server side call and secrets to be handled away from client view.  The
      first project we built was an 'Am I in a Floodzone?' which allowed the
      user to type in any address in the US, generate a [lat,lon] geolocation
      from the address, and determine if the located was within a floodplain,
      and it not how far away.  The developer team continually tried to use
      massive prompts to get the App and LLM working together properly, however
      I found that thoughtfully created tools with clear descriptions worked
      much better.  Additionally this did not immediately pollute the context
      window with excessive tokens initially.  The App needed to generate a
      correct result so that users could make a proper assessment, and it
      directed them to FEMA and flood insurance offerings if inside the
      floodzone.  Initially testing with lower quality and free models, we found
      that the better frontier models performed much more reliably, were able to
      use the tools properly, and at times inferred results beyond what was
      anticipated.  It did not require the most cutting edge models, e.g.
      gpt-5.2 vs gpt-4o-mini, which performed well for this application.

  - trigger: ':aieval'
    replace: When building AI systems, I believe the correct approach is to treat
      the AI in a similar manner to other API interactions.  You send a query to
      the LLM/Agent, and anticipate a range of responses.  While the response
      may not be exactly the same each time, using libraries such as Zod can
      truly help to define the shape of the input and output.  This would be
      crucial to any production grade system, and in this way the general
      architecture would not be considerably different than other
      systems.  Additional research will need to be conducted to evaluate text
      responses to determine if they meet the specified requirements, perhaps
      integrating AI test interpretation into the loop?  Using tools such as
      playwright can go quite far to control and test UI/UX interactions within
      AI powered applications.

