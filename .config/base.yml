    replace: '- Department had pressing need for instructors to tech technical analytics courses to graduate students. I proposed a curriculum focused on modern python data science workflows with an emphasis on GeoAI, spatial databases, cloud native data, imagery analysis and data pipelines.  - Excellent feedback from students and faculty, providing hands-on instruction for students to expand research into glacial remote sensing, earth observation, community epidemiology and urban land studies. Pursing interdisciplinary PhD with Computer Science Department faculty in 2026.'

  - trigger: ':bluerasterdesc'
    replace: '- ==Problem:== Company Leadership on AI integration to compete in Geospatial AI Market. - Solution: I promptly delivered a consensus on AI tooling, created a POC, gathered Dev Team support, and drove the prototype into an [MVP for client sales demos.](https://blueraster.com/capabilities/ai-geo-ai/)  App and tech stack integration with the AI SDK, Next.js, ArcGIS Maps SDK, and a seamless deploy on Vercel contributed to Blue Raster receiving the award for [Innovative Use of ArcGIS Technology](https://blueraster.com/stories/blue-raster-esri-devsummit-2026/) at the ESRI DevTech Summit in March 2026.  - Problem: Debug & Refactor complex legacy Systems.  - Solution: Led efforts to troubleshoot existing client applications & APIs as a technical expert, efficiently resoling difficult tickets. I also devised novel methodologies for scientific analytics with large-scale multiband raster data, arriving at efficient solutions that could be implemented with client-side logic. These efforts increased revenues through new and extended client contracts.  - As Senior Developer I owned the Software Development Life Cycle end-to-end, working with clients on business development, assessing requirements, proposing design alternatives (web, mobile, native), to building systems and deploying to Prod. At Blue Raster I met customers on their own cloud, working with AWS, Azure and GCP, architecting frontend and backend systems to solve business problems. '

  - trigger: ':airspacedesc'
    replace: '- Problem: Rapidly deliver flight critical UAS data products to Enterprise customers.  - Solution: Diagnosed repeatable parts of the workflow that could be automated, while conducting complex risk analysis. The process of moving from disconnected python scripts to deployed microservice APIs, reduced delivery time from weeks to less than one day, reducing costs and allowing features to be productized at scale.  - Problem: Pressing Market Demand for new feature requests not in current product pipeline.  - Solution:* Promoted to lead a small Dev Team to accelerate the AirHub Portal Markeplace, an App Store like Drone ecosystem for the Platform. Implemented an effective React App architecture that could incorporate several mini "Apps", and allowed features to be developed in tandem. I trained a backend engineer to quickly learn frontend tech, and we exceeded our delivery target for 2024 in 9 months, motivating several large clients to sign contracts.  '

  - trigger: ':3dapp'
    replace: "I created a 3D Globe application to understand DGGS using D3.js and deck.gl.  I've also worked with Three.js, though was specifically looking to construct a 3D Earth environment entirely using SVG graphics without the need for a basemap provider such as Mapbox for Maplibre.  D3 also complete customization in rendering and user interactions which make it both extremely flexible, and challenging to implement a specific visualization.  D3geo offers method for taking GeoJSON vector files(Natural Earth Land Data) and generating a proper projection to render graphics is the proper 3D space.  This library also expects a differing winding order for polygon coordinates, which will draw the polygon as a the hole and vice verse when flipped, as was the case here.  Additionally the rendering of countries across the antimeridian at 180 degrees of longitude does not work properly and the countries needed to be split along this axis.  The globe also is constantly rotating, with a slider that allows the speed to be adjusted.  Over time the the rotating would get slower and slower after user interactions.  I dug into the browser flame chart to see where most the issues originated, which happened to be in the javascript part of the timers for the animation.  The animation was using a mix of local and global variables, and the initialization needed to be moved outside of the timer function.  This increased performance 75% and completely eliminated the slowdown issue!"

  - trigger: 'ledfeature'
    replace: 'I was leading an App redesign project for a large wind utility construction firm.  The Application was primarily table based, and we were using a legacy implementation related to the existing data system being used by the client.  The Table API did not have positive user interactions, and made adding and removing features and user customization of the table difficult.  We switched to an updated React table library that had many of the basic API features built in, and this resulted in immediate improvements!  The primarily validation was customer trails through the staging and dev sites, and they continued to provide feedback to make the feature even better.  Unit tests were also implemented to ensure that all functionality was duplicated properly in the refactored table, though the user feedback was the primarily validation and acceptance criteria'